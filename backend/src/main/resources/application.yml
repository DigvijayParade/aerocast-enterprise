server:
  port: ${PORT:8000}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

spring:
  application:
    name: aerocast-backend
  cache:
    type: caffeine
    cache-names: actuals,forecasts,metrics
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

app:
  elexon:
    base-url: https://data.elexon.co.uk/bmrs/api/v1/datasets
    timeout-seconds: 60
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.aerocast: INFO
